steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_IMAGE}
      - --build-arg
      - VITE_API_BASE_URL=${_VITE_API_BASE_URL}
      - --build-arg
      - VITE_FIREBASE_API_KEY=${_VITE_FIREBASE_API_KEY}
      - --build-arg
      - VITE_FIREBASE_AUTH_DOMAIN=${_VITE_FIREBASE_AUTH_DOMAIN}
      - --build-arg
      - VITE_FIREBASE_PROJECT_ID=${_VITE_FIREBASE_PROJECT_ID}
      - --build-arg
      - VITE_FIREBASE_APP_ID=${_VITE_FIREBASE_APP_ID}
      - --build-arg
      - VITE_USE_FIREBASE_EMULATORS=
      - --build-arg
      - VITE_FIREBASE_AUTH_EMULATOR_HOST=
      - .

images:
  - ${_IMAGE}

options:
  logging: CLOUD_LOGGING_ONLY

# Defaults: _IMAGE points at the real production registry; _VITE_FIREBASE_* remain
# demo placeholders — production builds MUST override them via --substitutions
# (real values stay out of Git; see plans/phase-9/deploy-guide.md §0/§11).
substitutions:
  _IMAGE: asia-south1-docker.pkg.dev/ai-scientific-journal/ai-scientific-journal/app:manual
  _VITE_API_BASE_URL: /api/v1
  _VITE_FIREBASE_API_KEY: demo-key
  _VITE_FIREBASE_AUTH_DOMAIN: demo-test.firebaseapp.com
  _VITE_FIREBASE_PROJECT_ID: demo-test
  _VITE_FIREBASE_APP_ID: 1:123456789:web:abcdef
